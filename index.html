<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street 21</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#111
}

header{
padding:22px 6%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #eee
}

.logo{
font-size:24px;
font-weight:900;
letter-spacing:2px
}

.admin{
background:#111;
color:#fff;
border:0;
padding:12px 16px;
border-radius:9px;
font-weight:700
}

.hero{
padding:55px 6% 30px
}

.hero h1{
font-size:clamp(42px,9vw,80px);
margin:0;
letter-spacing:-4px
}

.hero p{
color:#666
}

.products{
padding:20px 6% 70px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:24px
}

.card{
border:1px solid #eee;
border-radius:14px;
overflow:hidden;
background:#fff
}

.gallery{
position:relative;
aspect-ratio:1/1;
background:#f3f3f3
}

.gallery img{
width:100%;
height:100%;
object-fit:cover
}

.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
width:38px;
height:38px;
border:0;
border-radius:50%;
background:rgba(255,255,255,.9);
font-size:24px;
z-index:2
}

.left{left:10px}
.right{right:10px}

.dots{
position:absolute;
bottom:10px;
left:0;
right:0;
text-align:center
}

.dot{
display:inline-block;
width:7px;
height:7px;
border-radius:50%;
background:#bbb;
margin:3px
}

.dot.active{
background:#111
}

.info{
padding:15px
}

.info h3{
margin:0 0 7px
}

.price{
font-weight:800
}

.empty{
grid-column:1/-1;
text-align:center;
color:#777;
padding:50px
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
padding:18px;
z-index:10;
overflow:auto
}

.box{
max-width:520px;
margin:30px auto;
background:#fff;
border-radius:18px;
padding:24px
}

.box h2{
margin-top:0
}

label{
display:block;
font-weight:700;
margin:14px 0 6px
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
font:inherit
}

textarea{
min-height:90px
}

.preview{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px
}

.preview img{
width:70px;
height:70px;
object-fit:cover;
border-radius:8px
}

.note{
font-size:12px;
color:#777;
margin-top:8px
}

.status{
font-size:13px;
color:#666;
margin-top:10px
}

.actions{
display:flex;
gap:10px;
margin-top:18px
}

.actions button{
flex:1;
padding:13px;
border:0;
border-radius:9px;
font-weight:700
}

.save{
background:#111;
color:#fff
}

.cancel{
background:#eee
}
</style>
</head>

<body>

<header>
<div class="logo">STREET 21</div>

<button class="admin" id="openAdmin">
+ Agregar producto
</button>
</header>

<section class="hero">
<h1>STREET 21</h1>
<p>Streetwear seleccionado. Exclusivo. Sin complicaciones.</p>
</section>

<section class="products" id="products"></section>

<div class="modal" id="modal">

<div class="box">

<h2>Agregar producto</h2>

<form id="productForm">

<label>Nombre</label>

<input
id="name"
required
placeholder="Ej. Essentials Tee"
>

<label>Precio (Q)</label>

<input
id="price"
type="number"
min="0"
step="0.01"
required
placeholder="300"
>

<label>Descripción</label>

<textarea
id="desc"
placeholder="Talla, color, detalles..."
></textarea>

<label>Fotos del producto</label>

<input
id="photos"
type="file"
accept="image/*"
multiple
required
>

<div class="preview" id="preview"></div>

<div class="note">
Puedes seleccionar varias fotos. Se comprimirán automáticamente.
</div>

<div class="status" id="status"></div>

<div class="actions">

<button
type="button"
class="cancel"
id="close"
>
Cancelar
</button>

<button
type="submit"
class="save"
id="save"
>
Guardar producto
</button>

</div>

</form>

</div>
</div>

<script>

const modal=document.getElementById("modal");
const form=document.getElementById("productForm");
const photos=document.getElementById("photos");
const preview=document.getElementById("preview");
const products=document.getElementById("products");
const status=document.getElementById("status");
const save=document.getElementById("save");


function getProducts(){

try{

return JSON.parse(
localStorage.getItem("street21_products") || "[]"
);

}catch(e){

return [];

}

}


function saveProducts(list){

localStorage.setItem(
"street21_products",
JSON.stringify(list)
);

}


function compressImage(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=function(){

const image=new Image();

image.onload=function(){

let width=image.width;
let height=image.height;

const max=1200;

if(width>max || height>max){

const ratio=Math.min(
max/width,
max/height
);

width=Math.round(width*ratio);
height=Math.round(height*ratio);

}

const canvas=document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(
image,
0,
0,
width,
height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.72
)
);

};

image.onerror=reject;

image.src=reader.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


function render(){

const list=getProducts();

products.innerHTML="";

if(!list.length){

products.innerHTML=
'<div class="empty">Todavía no hay productos. Agrega el primero arriba. 🔥</div>';

return;

}


list.forEach(function(product){

const card=document.createElement("article");

card.className="card";


const gallery=document.createElement("div");

gallery.className="gallery";


const image=document.createElement("img");

image.src=product.images[0];

gallery.appendChild(image);


let current=0;


if(product.images.length>1){

const left=document.createElement("button");

left.className="arrow left";

left.textContent="‹";


const right=document.createElement("button");

right.className="arrow right";

right.textContent="›";


const dots=document.createElement("div");

dots.className="dots";


product.images.forEach(function(){

const dot=document.createElement("span");

dot.className="dot";

dots.appendChild(dot);

});


function update(){

image.src=product.images[current];

Array.from(dots.children).forEach(
function(dot,index){

dot.classList.toggle(
"active",
index===current
);

});

}


left.onclick=function(){

current=
(current-1+product.images.length)
%product.images.length;

update();

};


right.onclick=function(){

current=
(current+1)
%product.images.length;

update();

};


gallery.appendChild(left);

gallery.appendChild(right);

gallery.appendChild(dots);

update();

}


const info=document.createElement("div");

info.className="info";


const title=document.createElement("h3");

title.textContent=product.name;


const price=document.createElement("div");

price.className="price";

price.textContent=
"Q "+
Number(product.price)
.toLocaleString("es-GT");


const description=document.createElement("p");

description.textContent=
product.desc || "";


info.appendChild(title);

info.appendChild(price);

info.appendChild(description);


card.appendChild(gallery);

card.appendChild(info);

products.appendChild(card);

});

}


document.getElementById("openAdmin").onclick=function(){

modal.style.display="block";

status.textContent="";

};


document.getElementById("close").onclick=function(){

modal.style.display="none";

};


modal.onclick=function(event){

if(event.target===modal){

modal.style.display="none";

}

};


photos.onchange=function(){

preview.innerHTML="";

Array.from(photos.files).forEach(function(file){

const reader=new FileReader();

reader.onload=function(event){

const img=document.createElement("img");

img.src=event.target.result;

preview.appendChild(img);

};

reader.readAsDataURL(file);

});

};


form.onsubmit=async function(event){

event.preventDefault();

save.disabled=true;

status.textContent=
"Comprimiendo fotos...";


try{

const files=
Array.from(photos.files);

const images=[];


for(const file of files){

const compressed=
await compressImage(file);

images.push(compressed);

}


const product={

name:
document.getElementById("name")
.value.trim(),

price:
document.getElementById("price")
.value,

desc:
document.getElementById("desc")
.value.trim(),

images:images

};


const list=getProducts();

list.push(product);


const test=
JSON.stringify(list);


if(test.length>4500000){

throw new Error("storage");

}


saveProducts(list);

render();

form.reset();

preview.innerHTML="";

status.textContent="";

modal.style.display="none";


}catch(error){

status.textContent=
"No se pudo guardar. Prueba con menos fotos.";

}


save.disabled=false;

};


render();

</script>

</body>
</html>
