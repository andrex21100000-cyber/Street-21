<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street 21</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:Arial,sans-serif
}

header{
  padding:22px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee
}

.logo{
  font-weight:900;
  letter-spacing:2px;
  font-size:24px
}

.admin{
  background:#111;
  color:#fff;
  border:0;
  border-radius:8px;
  padding:11px 15px;
  font-weight:700
}

.hero{
  padding:55px 6% 30px
}

.hero h1{
  font-size:clamp(38px,8vw,78px);
  margin:0 0 10px;
  letter-spacing:-3px
}

.hero p{
  color:#666
}

.products{
  padding:20px 6% 70px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:24px
}

.card{
  border:1px solid #eee;
  border-radius:14px;
  overflow:hidden;
  background:#fff
}

.photo{
  aspect-ratio:1/1;
  background:#f3f3f3;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover
}

.info{
  padding:15px
}

.info h3{
  margin:0 0 7px
}

.price{
  font-weight:800
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:#777;
  padding:50px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  padding:20px;
  z-index:10;
  overflow:auto
}

.box{
  max-width:520px;
  margin:40px auto;
  background:#fff;
  border-radius:18px;
  padding:24px
}

.box h2{
  margin-top:0
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 6px
}

input,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font:inherit
}

textarea{
  min-height:90px
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px
}

.actions button{
  flex:1;
  padding:13px;
  border:0;
  border-radius:9px;
  font-weight:700
}

.save{
  background:#111;
  color:#fff
}

.cancel{
  background:#eee
}

.preview{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px
}

.preview img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:8px
}

.note{
  font-size:12px;
  color:#777;
  margin-top:8px
}
</style>
</head>

<body>

<header>
  <div class="logo">STREET 21</div>
  <button class="admin" id="openAdmin">+ Agregar producto</button>
</header>

<section class="hero">
  <h1>STREET 21</h1>
  <p>Streetwear seleccionado. Exclusivo. Sin complicaciones.</p>
</section>

<section class="products" id="products"></section>

<div class="modal" id="modal">

  <div class="box">

    <h2>Agregar producto</h2>

    <form id="productForm">

      <label>Nombre</label>
      <input id="name" required placeholder="Ej. Essentials Tee">

      <label>Precio (Q)</label>
      <input
        id="price"
        type="number"
        min="0"
        step="0.01"
        required
        placeholder="300"
      >

      <label>Descripción</label>
      <textarea
        id="desc"
        placeholder="Talla, color, detalles..."
      ></textarea>

      <label>Fotos</label>

      <input
        id="photos"
        type="file"
        accept="image/*"
        multiple
        required
      >

      <div class="preview" id="preview"></div>

      <div class="note">
        Puedes seleccionar varias fotos directamente desde tu iPhone.
      </div>

      <div class="actions">

        <button
          type="button"
          class="cancel"
          id="close"
        >
          Cancelar
        </button>

        <button
          class="save"
          type="submit"
        >
          Guardar producto
        </button>

      </div>

    </form>

  </div>

</div>

<script>

const modal = document.getElementById("modal");

const form = document.getElementById("productForm");

const photos = document.getElementById("photos");

const preview = document.getElementById("preview");

const products = document.getElementById("products");


function getProducts(){

  return JSON.parse(
    localStorage.getItem("street21_products") || "[]"
  );

}


function saveProducts(list){

  localStorage.setItem(
    "street21_products",
    JSON.stringify(list)
  );

}


function render(){

  const list = getProducts();

  products.innerHTML = "";

  if(!list.length){

    products.innerHTML =
      '<div class="empty">Todavía no hay productos. Agrega el primero arriba. 🔥</div>';

    return;
  }


  list.forEach(function(p){

    const card = document.createElement("article");

    card.className = "card";


    const photo = document.createElement("div");

    photo.className = "photo";


    if(p.images && p.images[0]){

      const img = document.createElement("img");

      img.src = p.images[0];

      photo.appendChild(img);

    }else{

      photo.textContent = "Sin foto";

    }


    const info = document.createElement("div");

    info.className = "info";


    const title = document.createElement("h3");

    title.textContent = p.name;


    const price = document.createElement("div");

    price.className = "price";

    price.textContent =
      "Q " + Number(p.price).toLocaleString("es-GT");


    const description = document.createElement("p");

    description.textContent = p.desc || "";


    info.appendChild(title);

    info.appendChild(price);

    info.appendChild(description);


    card.appendChild(photo);

    card.appendChild(info);


    products.appendChild(card);

  });

}


document.getElementById("openAdmin").onclick =
  function(){

    modal.style.display = "block";

  };


document.getElementById("close").onclick =
  function(){

    modal.style.display = "none";

  };


modal.onclick =
  function(e){

    if(e.target === modal){

      modal.style.display = "none";

    }

  };


photos.onchange =
  function(){

    preview.innerHTML = "";

    Array.from(photos.files).forEach(function(file){

      const reader = new FileReader();

      reader.onload =
        function(e){

          const img = document.createElement("img");

          img.src = e.target.result;

          preview.appendChild(img);

        };

      reader.readAsDataURL(file);

    });

  };


form.onsubmit =
  async function(e){

    e.preventDefault();


    const files =
      Array.from(photos.files);


    const images =
      await Promise.all(

        files.map(function(file){

          return new Promise(function(resolve){

            const reader =
              new FileReader();

            reader.onload =
              function(){

                resolve(reader.result);

              };

            reader.readAsDataURL(file);

          });

        })

      );


    const item = {

      name:
        document.getElementById("name").value.trim(),

      price:
        document.getElementById("price").value,

      desc:
        document.getElementById("desc").value.trim(),

      images:
        images

    };


    const list = getProducts();

    list.push(item);

    saveProducts(list);

    render();


    form.reset();

    preview.innerHTML = "";

    modal.style.display = "none";

  };


render();

</script>

</body>
</html>
