<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street 21</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:Arial,sans-serif;
}

header{
  padding:22px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
}

.logo{
  font-weight:900;
  letter-spacing:2px;
  font-size:24px;
}

button{
  font:inherit;
  cursor:pointer;
}

.buy,.save{
  background:#111;
  color:#fff;
  border:0;
  border-radius:9px;
  padding:12px 15px;
  font-weight:700;
}

.hero{
  padding:55px 6% 30px;
}

.hero h1{
  font-size:clamp(38px,8vw,78px);
  margin:0 0 10px;
  letter-spacing:-3px;
}

.hero p{
  color:#666;
}

.products{
  padding:20px 6% 70px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:24px;
}

.card{
  border:1px solid #eee;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
}

.photo{
  background:#f3f3f3;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
}

.photo img{
  max-width:100%;
}

.info{
  padding:15px;
}

.info h3{
  margin:0 0 7px;
}

.price{
  font-weight:800;
}

.buy{
  width:100%;
  margin-top:12px;
}

.buy:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:6px 9px;
  border-radius:999px;
  background:#111;
  color:#fff;
  font-size:12px;
  font-weight:800;
}

.status.available{
  background:#e9f7ee;
  color:#176b36;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:#777;
  padding:50px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  padding:20px;
  z-index:10;
  overflow:auto;
}

.box{
  max-width:520px;
  margin:40px auto;
  background:#fff;
  border-radius:18px;
  padding:24px;
}

.box h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 6px;
}

input,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font:inherit;
}

textarea{
  min-height:90px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.actions button{
  flex:1;
  padding:13px;
  border:0;
  border-radius:9px;
  font-weight:700;
}

.cancel{
  background:#eee;
}

.payment-option{
  border:1px solid #ddd;
  border-radius:10px;
  padding:13px;
  margin:8px 0;
  cursor:pointer;
}

.payment-option input{
  width:auto;
  margin-right:8px;
}

.bank-box{
  display:none;
  background:#f5f5f5;
  border-radius:10px;
  padding:14px;
  margin-top:10px;
  font-size:14px;
}

.note{
  font-size:12px;
  color:#777;
  margin-top:8px;
}

/* GALERÍA */

.product-gallery{
  width:100%;
  padding:10px;
}

.main-product-image{
  display:block;
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}

.thumbnails{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:10px;
  padding-bottom:3px;
}

.thumbnail{
  width:65px !important;
  height:65px !important;
  object-fit:cover !important;
  border-radius:8px;
  cursor:pointer;
  flex-shrink:0;
  border:2px solid transparent;
}

.thumbnail:hover{
  border-color:#111;
}
</style>
</head>

<body>

<header>
  <div class="logo">STREET 21</div>
</header>

<section class="hero">
  <h1>STREET 21</h1>
  <p>Streetwear seleccionado. Exclusivo. Sin complicaciones.</p>
</section>

<section class="products" id="products"></section>


<!-- VENTANA DE COMPRA -->

<div class="modal" id="buyModal">

  <div class="box">

    <h2>Comprar producto</h2>

    <div id="buyProductInfo"></div>

    <form id="buyForm">

      <label>Nombre completo</label>

      <input
        id="buyerName"
        required
        placeholder="Tu nombre"
      >

      <label>Teléfono</label>

      <input
        id="buyerPhone"
        type="tel"
        required
        placeholder="Tu número"
      >

      <label>Dirección de entrega</label>

      <textarea
        id="buyerAddress"
        required
        placeholder="Dirección donde recibirás tu pedido"
      ></textarea>


      <label>Forma de pago</label>

      <label class="payment-option">

        <input
          type="radio"
          name="payment"
          value="cod"
          required
        >

        Pago contra entrega — Q300

      </label>


      <label class="payment-option">

        <input
          type="radio"
          name="payment"
          value="transfer"
        >

        Depósito / transferencia — Q285

      </label>


      <div class="bank-box" id="bankBox">

        <strong>
          Datos para depósito / transferencia
        </strong>

        <br><br>

        Banco Industrial (BI)<br>

        Número de cuenta:
        <strong>3674276</strong><br>

        Tipo de cuenta:
        <strong>Ahorro</strong><br>

        Nombre del titular:
        <strong>Evelyn Pérez</strong>

        <br><br>

        Después de realizar el depósito,
        guarda tu comprobante.

      </div>


      <div class="actions">

        <button
          type="button"
          class="cancel"
          id="closeBuy"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="save"
        >
          Enviar pedido por WhatsApp
        </button>

      </div>

    </form>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://wifkqfgmijvqxevkwssx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3TSP06gKZhqhFFqBfh8vhw_zGSmAMh3";

const WHATSAPP_NUMBER =
"50248501010";

let selectedProduct = null;


/* CARGAR PRODUCTOS DESDE SUPABASE */

async function loadProducts(){

  const box =
    document.getElementById("products");

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=*&order=created_at.desc",
        {
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " + SUPABASE_KEY
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "No se pudieron cargar los productos."
      );

    }


    const list =
      await response.json();


    renderProducts(list);


  }catch(error){

    box.innerHTML =
      '<div class="empty">' +
      error.message +
      '</div>';

  }

}


/* MOSTRAR PRODUCTOS */

function renderProducts(list){

  const box =
    document.getElementById("products");

  box.innerHTML = "";


  if(!list.length){

    box.innerHTML =
      '<div class="empty">' +
      'Todavía no hay productos.' +
      '</div>';

    return;

  }


  list.forEach(function(product){

    const card =
      document.createElement("article");

    card.className =
      "card";


    /* GALERÍA DE FOTOS */

    const photo =
      document.createElement("div");

    photo.className =
      "photo";


    if(
      product.images &&
      product.images.length
    ){

      const gallery =
        document.createElement("div");

      gallery.className =
        "product-gallery";


      /* FOTO PRINCIPAL */

      const mainImg =
        document.createElement("img");

      mainImg.className =
        "main-product-image";

      mainImg.src =
        product.images[0];

      mainImg.alt =
        product.name ||
        "Producto";


      gallery.appendChild(
        mainImg
      );


      /* MINIATURAS */

      if(
        product.images.length > 1
      ){

        const thumbnails =
          document.createElement("div");

        thumbnails.className =
          "thumbnails";


        product.images.forEach(
          function(imageUrl,index){

            const thumb =
              document.createElement("img");

            thumb.className =
              "thumbnail";

            thumb.src =
              imageUrl;

            thumb.alt =
              "Foto " +
              (index + 1);


            thumb.onclick =
              function(){

                mainImg.src =
                  imageUrl;

              };


            thumbnails.appendChild(
              thumb
            );

          }
        );


        gallery.appendChild(
          thumbnails
        );

      }


      photo.appendChild(
        gallery
      );


    }else{

      photo.textContent =
        "Sin foto";

    }


    /* INFORMACIÓN */

    const info =
      document.createElement("div");

    info.className =
      "info";


    const title =
      document.createElement("h3");

    title.textContent =
      product.name ||
      "Producto";


    const price =
      document.createElement("div");

    price.className =
      "price";

    price.textContent =
      "Q " +
      Number(
        product.price || 0
      ).toLocaleString("es-GT");


    const description =
      document.createElement("p");

    description.textContent =
      product.description ||
      "";


    /* ESTADO */

    const status =
      document.createElement("span");

    status.className =
      "status " +
      (
        product.sold_out
          ? ""
          : "available"
      );


    status.textContent =
      product.sold_out
        ? "AGOTADO"
        : "DISPONIBLE";


    /* BOTÓN COMPRAR */

    const buy =
      document.createElement("button");

    buy.type =
      "button";

    buy.className =
      "buy";

    buy.textContent =
      product.sold_out
        ? "Agotado"
        : "Comprar";

    buy.disabled =
      !!product.sold_out;


    buy.addEventListener(
      "click",
      function(){

        if(product.sold_out)
          return;


        selectedProduct =
          product;


        document.getElementById(
          "buyProductInfo"
        ).innerHTML =
          "<strong>" +
          escapeHtml(
            product.name
          ) +
          "</strong><br>" +
          "Precio publicado: Q " +
          Number(
            product.price
          ).toLocaleString("es-GT");


        document.getElementById(
          "buyModal"
        ).style.display =
          "block";

      }
    );


    info.appendChild(
      title
    );

    info.appendChild(
      price
    );

    info.appendChild(
      description
    );

    info.appendChild(
      status
    );

    info.appendChild(
      buy
    );


    card.appendChild(
      photo
    );

    card.appendChild(
      info
    );


    box.appendChild(
      card
    );

  });

}


/* SEGURIDAD PARA TEXTO */

function escapeHtml(text){

  return String(
    text || ""
  ).replace(
    /[&<>"']/g,
    function(character){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[character];

    }
  );

}


/* CERRAR COMPRA */

document.getElementById(
  "closeBuy"
).addEventListener(
  "click",
  function(){

    document.getElementById(
      "buyModal"
    ).style.display =
      "none";

  }
);


/* CERRAR AL TOCAR AFUERA */

document.getElementById(
  "buyModal"
).addEventListener(
  "click",
  function(event){

    if(
      event.target.id ===
      "buyModal"
    ){

      event.target.style.display =
        "none";

    }

  }
);


/* FORMA DE PAGO */

document
  .querySelectorAll(
    'input[name="payment"]'
  )
  .forEach(
    function(radio){

      radio.addEventListener(
        "change",
        function(){

          document.getElementById(
            "bankBox"
          ).style.display =
            this.value === "transfer"
              ? "block"
              : "none";

        }
      );

    }
  );


/* ENVIAR PEDIDO A WHATSAPP */

document.getElementById(
  "buyForm"
).addEventListener(
  "submit",
  function(event){

    event.preventDefault();


    if(!selectedProduct)
      return;


    const payment =
      document.querySelector(
        'input[name="payment"]:checked'
      ).value;


    const transfer =
      payment === "transfer";


    const total =
      transfer
        ? "285"
        : "300";


    const paymentText =
      transfer
        ? "Depósito / transferencia"
        : "Pago contra entrega";


    const message = [

      "🔥 NUEVO PEDIDO - STREET 21",

      "",

      "Producto: " +
      selectedProduct.name,

      "Total: Q" +
      total,

      "Forma de pago: " +
      paymentText,

      "Nombre: " +
      document.getElementById(
        "buyerName"
      ).value,

      "Teléfono: " +
      document.getElementById(
        "buyerPhone"
      ).value,

      "Dirección: " +
      document.getElementById(
        "buyerAddress"
      ).value

    ].join("\n");


    window.location.href =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(
        message
      );

  }
);


/* INICIAR */

loadProducts();

</script>

</body>
</html>
