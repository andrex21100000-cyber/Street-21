<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street 21 | Streetwear Guatemala</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b0b0b;
  color:#fff
}

a{
  text-decoration:none;
  color:inherit
}

header{
  position:sticky;

  border-bottom:1px solid #252525
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:18px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:2px
}

.logo span{
  color:#aaa
}

nav a{
  margin-left:20px;
  color:#ddd;
  font-size:14px
}

.hero{
  min-height:78vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 22px;
  background:radial-gradient(
    circle at 50% 30%,
    #252525 0,
    #111 38%,
    #080808 75%
  )
}

.hero h1{
  font-size:clamp(58px,12vw,130px);
  line-height:.85;
  letter-spacing:-6px;
  font-weight:950
}

.hero p{
  margin:28px auto;
  max-width:600px;
  color:#bdbdbd;
  font-size:16px;
  line-height:1.6
}

.btn{
  display:inline-block;
  background:#fff;
  color:#000;
  padding:14px 25px;
  border-radius:3px;
  font-weight:800;
  font-size:14px
}

section{
  max-width:1150px;
  margin:auto;
  padding:75px 22px
}

.title{
  font-size:34px;
  margin-bottom:10px
}

.subtitle{
  color:#999;
  margin-bottom:30px
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:8px;
  overflow:hidden
}

.photo{
  height:300px;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#666;
  font-size:13px;
  overflow:hidden
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover
}

.info{
  padding:18px
}

.info h3{
  font-size:17px;
  margin-bottom:8px
}

.price{
  font-weight:800;
  margin-bottom:15px
}

.buy{
  width:100%;
  border:0;
  background:#fff;
  color:#000;
  padding:12px;
  border-radius:3px;
  font-weight:800;
  cursor:pointer
}

.about{
  border-top:1px solid #252525;
  border-bottom:1px solid #252525;
  text-align:center
}

.about p{
  max-width:700px;
  margin:15px auto;
  color:#aaa;
  line-height:1.7
}

footer{
  text-align:center;
  padding:35px 20px;
  color:#777;
  font-size:13px
}

.cart{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#fff;
  color:#000;
  border:0;
  border-radius:50px;
  padding:15px 20px;
  font-weight:900;
  box-shadow:0 8px 30px #000;
  cursor:pointer
}

/* ADMIN */

.admin-box{
  margin-top:35px;
  border-top:1px solid #292929;
  padding-top:25px
}

.admin-toggle,
.save-btn,
.clear-btn{
  border:0;
  cursor:pointer;
  padding:12px 16px;
  border-radius:4px;
  font-weight:800
}

.admin-toggle{
  background:#222;
  color:#fff;
  border:1px solid #444
}

.admin-panel{
  margin-top:15px;
  background:#121212;
  border:1px solid #292929;
  border-radius:8px;
  padding:20px;
  max-width:650px
}

.admin-panel h3{
  margin-bottom:15px
}

.admin-panel input,
.admin-panel textarea{
  display:block;
  width:100%;
  margin:10px 0;
  padding:12px;
  background:#080808;
  border:1px solid #333;
  color:#fff;
  border-radius:4px
}

.admin-panel textarea{
  min-height:80px;
  resize:vertical
}

.upload-label{
  display:block;
  margin:15px 0 6px;
  font-size:12px;
  font-weight:800
}

.upload-label input{
  margin-top:8px
}

.admin-panel small{
  display:block;
  color:#888;
  margin-bottom:15px
}

.save-btn{
  background:#fff;
  color:#000
}

.clear-btn{
  background:#2a2a2a;
  color:#fff;
  margin-left:8px
}

.admin-note{
  color:#777;
  font-size:12px;
  line-height:1.5;
  margin-top:15px
}

/* GALERÍA DE FOTOS */

.product-gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  height:100%;
  width:100%;
  overflow:hidden
}

.product-gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.product-gallery.one{
  grid-template-columns:1fr
}

.product-gallery.three,
.product-gallery.four{
  grid-template-columns:repeat(2,1fr)
}

.empty-products{
  grid-column:1/-1;
  text-align:center;
  color:#777;
  padding:45px 10px;
  border:1px dashed #333
}

.card .clear-btn{
  cursor:pointer;
  border:1px solid #444
}

@media(max-width:650px){

  nav a{
    margin-left:10px;
    font-size:12px
  }

  .hero h1{
    letter-spacing:-3px
  }

  .photo{
    height:260px
  }

}
</style>
</head>
