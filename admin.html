<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STREET 21 · Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
header{background:#111;color:#fff;padding:22px}
.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;margin:6px 0 14px}
textarea{min-height:90px}
button{border:0;border-radius:9px;padding:12px 16px;cursor:pointer}
.primary{background:#111;color:#fff}
.gray{background:#e9e9e9}
.danger{background:#c62828;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1}
.msg{font-weight:700;margin:10px 0}
.error{color:#b00020}
.success{color:#18794e}
.product{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}
.thumb{width:90px;height:90px;object-fit:cover;border-radius:8px;margin:4px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eee;font-size:12px;font-weight:700}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>STREET 21 · ADMIN</h1>
<div style="color:#bbb">Panel privado</div>
</div>
</header>

<div class="wrap">

<section class="card">
<h2>Agregar producto</h2>

<input id="name" placeholder="Nombre del producto">

<input id="price" type="number" min="0" placeholder="Precio (Q)">

<textarea id="description" placeholder="Descripción"></textarea>

<input id="photos" type="file" accept="image/*" multiple>

<div class="row">
<button class="primary" id="addBtn">Agregar producto</button>
<button class="gray" id="refreshBtn">Actualizar lista</button>
</div>

<div id="msg" class="msg"></div>
</section>

<section class="card">
<h2>Productos</h2>
<div id="products">Cargando...</div>
</section>

</div>

<script>

const API="https://wifkqfgmijvqxevkwssx.supabase.co/functions/v1/street21-admin";

const KEY="9pvHKCBkura9CY0KY3ctNMophJuB3O6pua2_xkpU4c8";

let products=[];

const $=id=>document.getElementById(id);

async function call(action,data={}){

const r=await fetch(API,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
key:KEY,
action,
...data
})
});

const t=await r.text();

let j;

try{
j=JSON.parse(t)
}catch{
j={error:t}
}

if(!r.ok)
throw new Error(j.error||("HTTP "+r.status));

return j;
}

async function load(){

try{

const d=await call("list");

render(Array.isArray(d)?d:[]);

}catch(e){

$("products").innerHTML=
'<div class="error">'+esc(e.message)+'</div>';

}

}

function render(list){

products=list;

if(!list.length){

$("products").innerHTML=
"<p>No hay productos todavía.</p>";

return;
}

$("products").innerHTML=list.map(p=>

'<div class="product">'+

'<h3>'+esc(p.name||"Sin nombre")+'</h3>'+

'<p><b>Q'+esc(p.price??"")+'</b></p>'+

'<p>'+esc(p.description||"")+'</p>'+

'<div>'+
(p.images||[]).map(u=>
'<img class="thumb" src="'+esc(u)+'">'
).join("")+
'</div>'+

'<p><span class="badge">'+
(p.sold_out?"AGOTADO":"DISPONIBLE")+
'</span></p>'+

'<div class="row">'+

'<button class="gray" onclick="toggle(\''+
esc(p.id)+
'\','+
(!p.sold_out)+
')">'+
(p.sold_out?"Poner disponible":"Marcar agotado")+
'</button>'+

'<button class="gray" onclick="edit(\''+
esc(p.id)+
'\')">Editar</button>'+

'<button class="danger" onclick="del(\''+
esc(p.id)+
'\')">Eliminar</button>'+

'</div>'+

'</div>'

).join("");

}

window.toggle=async(id,s)=>{

try{

await call("soldout",{
id,
sold_out:s
});

load();

}catch(e){

alert(e.message);

}

};

window.del=async id=>{

if(!confirm("¿Eliminar este producto?"))
return;

try{

await call("delete",{id});

load();

}catch(e){

alert(e.message);

}

};

window.edit=id=>{

const p=products.find(
x=>String(x.id)===String(id)
);

if(!p)return;

$("name").value=p.name||"";
$("price").value=p.price??"";
$("description").value=p.description||"";

$("addBtn").dataset.id=p.id;

$("addBtn").textContent="Guardar cambios";

scrollTo({
top:0,
behavior:"smooth"
});

};

$("addBtn").onclick=async()=>{

const id=$("addBtn").dataset.id;

const name=$("name").value.trim();

const price=$("price").value;

const description=$("description").value.trim();

const fs=[...$("photos").files];

if(!name||!price)
return msg("Pon nombre y precio.");

if(fs.length>4)
return msg("Máximo 4 fotos.");

$("addBtn").disabled=true;

msg(
id?"Guardando...":"Agregando...",
false
);

try{

const images=fs.length
?await Promise.all(fs.map(read))
:null;

if(id){

await call("update",{
id,
name,
price:Number(price),
description,
...(images?{images}:{})
});

}else{

await call("add",{
name,
price:Number(price),
description,
images:images||[]
});

}

$("name").value="";
$("price").value="";
$("description").value="";
$("photos").value="";

delete $("addBtn").dataset.id;

$("addBtn").textContent="Agregar producto";

msg("Listo ✅",false);

load();

}catch(e){

msg(e.message);

}finally{

$("addBtn").disabled=false;

}

};

$("refreshBtn").onclick=load;

function read(f){

return new Promise((ok,no)=>{

const r=new FileReader();

r.onload=()=>ok({

name:f.name,

type:f.type,

data:String(r.result).split(",")[1]

});

r.onerror=no;

r.readAsDataURL(f);

});

}

function msg(t,err=true){

$("msg").textContent=t;

$("msg").className=
"msg "+(err?"error":"success");

}

function esc(s){

return String(s).replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

}

load();

</script>

</body>
</html>
