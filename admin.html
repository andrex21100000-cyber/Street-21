<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STREET 21 · Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
header{background:#111;color:#fff;padding:22px}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #00000012}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;margin:6px 0 14px}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:9px;padding:12px 16px;cursor:pointer}
.primary{background:#111;color:#fff}
.gray{background:#e9e9e9}
.danger{background:#c62828;color:#fff}
.ok{background:#18794e;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.msg{font-weight:700;margin:10px 0}
.error{color:#b00020}
.success{color:#18794e}
.product{border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}
.thumb{width:90px;height:90px;object-fit:cover;border-radius:8px;margin:4px}
.hidden{display:none}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<header><div class="wrap"><h1>STREET 21 · ADMIN</h1><div class="small" style="color:#bbb">Panel privado</div></div></header>

<div class="wrap">

<section id="login" class="card">
<h2>Acceso</h2>
<p>Escribe tu código de administrador.</p>
<input id="code" type="password" placeholder="Código de acceso">
<button class="primary" id="enterBtn">Entrar</button>
<div id="loginMsg" class="msg"></div>
</section>

<section id="panel" class="hidden">
<div class="card">
<h2>Agregar producto</h2>
<label>Nombre</label>
<input id="name" placeholder="Ej. Essentials Black T-Shirt">

<label>Precio (Q)</label>
<input id="price" type="number" min="0" step="1" placeholder="300">

<label>Descripción</label>
<textarea id="description" placeholder="Descripción del producto"></textarea>

<label>Fotos (máximo 4)</label>
<input id="photos" type="file" accept="image/*" multiple>

<div class="row">
<button class="primary" id="addBtn">Agregar producto</button>
<button class="gray" id="refreshBtn">Actualizar lista</button>
</div>
<div id="formMsg" class="msg"></div>
</div>

<div class="card">
<h2>Productos</h2>
<div id="products">Cargando...</div>
</div>
</section>
</div>

<script>
const FUNCTION_URL = "https://entphlnycmrgulvvyign.supabase.co/functions/v1/street21-admin";
const PUBLISHABLE_KEY = "sb_publishable_3t7TJcHlRF9gaI8791GtJw_VikOVDCe";
let adminCode = "";

const $ = id => document.getElementById(id);

async function api(action, extra = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);

  try {
    const res = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": PUBLISHABLE_KEY
      },
      body: JSON.stringify({ code: adminCode, action, ...extra }),
      signal: controller.signal
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = {error:text}; }

    if (!res.ok) throw new Error(data.error || ("Error HTTP " + res.status));
    return data;
  } finally {
    clearTimeout(timer);
  }
}

$("enterBtn").onclick = async () => {
  const code = $("code").value.trim();
  if (!code) {
    $("loginMsg").textContent = "Escribe el código.";
    $("loginMsg").className = "msg error";
    return;
  }

  adminCode = code;
  $("loginMsg").textContent = "Conectando...";
  $("loginMsg").className = "msg";

  try {
    await api("list");
    $("login").classList.add("hidden");
    $("panel").classList.remove("hidden");
    $("loginMsg").textContent = "";
    await loadProducts();
  } catch (e) {
    adminCode = "";
    $("loginMsg").textContent =
      e.name === "AbortError" ? "La conexión tardó demasiado." : e.message;
    $("loginMsg").className = "msg error";
  }
};

async function loadProducts() {
  $("products").textContent = "Cargando...";
  try {
    const data = await api("list");
    renderProducts(Array.isArray(data) ? data : []);
  } catch (e) {
    $("products").innerHTML =
      '<div class="error">No se pudo cargar: ' + escapeHtml(e.message) + '</div>';
  }
}

function renderProducts(list) {
  if (!list.length) {
    $("products").innerHTML = "<p>No hay productos todavía.</p>";
    return;
  }

  $("products").innerHTML = list.map(p => {
    const imgs = Array.isArray(p.images) ? p.images : [];
    return `
      <div class="product">
        <h3>${escapeHtml(p.name || "Sin nombre")}</h3>
        <p><b>Q${escapeHtml(String(p.price ?? ""))}</b></p>
        <p>${escapeHtml(p.description || "")}</p>
        <div>${imgs.map(u => `<img class="thumb" src="${escapeAttr(u)}">`).join("")}</div>
        <p><b>${p.sold_out ? "AGOTADO" : "DISPONIBLE"}</b></p>
        <div class="row">
          <button class="${p.sold_out ? "ok" : "gray"}"
            onclick="toggleSold('${escapeAttr(p.id)}', ${!p.sold_out})">
            ${p.sold_out ? "Poner disponible" : "Marcar agotado"}
          </button>
          <button class="danger" onclick="removeProduct('${escapeAttr(p.id)}')">Eliminar</button>
        </div>
      </div>`;
  }).join("");
}

window.toggleSold = async (id, sold_out) => {
  try {
    await api("soldout", {id, sold_out});
    await loadProducts();
  } catch(e) {
    alert(e.message);
  }
};

window.removeProduct = async (id) => {
  if (!confirm("¿Eliminar este producto?")) return;
  try {
    await api("delete", {id});
    await loadProducts();
  } catch(e) {
    alert(e.message);
  }
};

$("addBtn").onclick = async () => {
  const name = $("name").value.trim();
  const price = $("price").value;
  const description = $("description").value.trim();
  const files = [...$("photos").files];

  if (!name || !price) {
    $("formMsg").textContent = "Pon nombre y precio.";
    $("formMsg").className = "msg error";
    return;
  }

  if (files.length > 4) {
    $("formMsg").textContent = "Máximo 4 fotos.";
    $("formMsg").className = "msg error";
    return;
  }

  $("addBtn").disabled = true;
  $("formMsg").textContent = "Subiendo producto...";
  $("formMsg").className = "msg";

  try {
    const images = await Promise.all(files.map(fileToBase64));
    await api("add", {
      name,
      price: Number(price),
      description,
      images
    });

    $("name").value = "";
    $("price").value = "";
    $("description").value = "";
    $("photos").value = "";
    $("formMsg").textContent = "Producto agregado correctamente.";
    $("formMsg").className = "msg success";
    await loadProducts();
  } catch(e) {
    $("formMsg").textContent = e.name === "AbortError"
      ? "La conexión tardó demasiado."
      : e.message;
    $("formMsg").className = "msg error";
  } finally {
    $("addBtn").disabled = false;
  }
};

$("refreshBtn").onclick = loadProducts;

function fileToBase64(file) {
  return new Promise((resolve,reject) => {
    const r = new FileReader();
    r.onload = () => resolve({
      name:file.name,
      type:file.type,
      data:String(r.result).split(",")[1]
    });
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
</script>
</body>
</html>
