<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREET 21 — Admin Privado</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif}
header{background:#111;color:#fff;padding:22px 6%;font-weight:900;letter-spacing:2px;font-size:24px}
.wrap{max-width:900px;margin:30px auto;padding:0 18px}.box{background:#fff;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 5px 20px #0000000d}
h1,h2{margin-top:0}label{display:block;font-weight:700;margin:13px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit}
textarea{min-height:90px}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:12px 15px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff}.gray{background:#eee}.danger{background:#fee;color:#b00020}.stock{background:#eee}
.msg{margin-top:12px;font-weight:700}.error{color:#b00020}.ok{color:#176b36}
.card{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:12px;display:grid;grid-template-columns:90px 1fr;gap:14px}
.thumb{width:90px;height:90px;background:#eee;border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#777}
.thumb img{width:100%;height:100%;object-fit:cover}.small{color:#666;font-size:13px}
@media(max-width:600px){.card{grid-template-columns:1fr}.thumb{width:100%;height:180px}}
</style>
</head>
<body>
<header>STREET 21 · ADMIN PRIVADO</header>
<div class="wrap">

<div class="box">
<h1>Administrar productos</h1>
<p class="small">Este panel usa la base de datos de STREET 21. No se modifica la página pública directamente.</p>

<form id="productForm">
<label>Nombre</label>
<input id="name" required placeholder="Ej. Essentials Tee">

<label>Precio (Q)</label>
<input id="price" type="number" min="0" step="0.01" required placeholder="300">

<label>Descripción</label>
<textarea id="description" placeholder="Talla, color, detalles..."></textarea>

<label>Fotos</label>
<input id="images" type="file" accept="image/*" multiple required>

<div class="actions">
<button class="primary" type="submit">Agregar producto</button>
<button class="gray" type="button" id="reload">Actualizar lista</button>
</div>
<p id="msg" class="msg"></p>
</form>
</div>

<div class="box">
<h2>Productos</h2>
<div id="list">Cargando...</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://entphlnycmrgulvvyign.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_3t7TJcHlRF9gaI8791GtJw_VikOVDCe";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const ADMIN_UID="cf9b38f8-8bc6-45f6-b96a-d42c7dd94152";
const list=document.getElementById("list"), msg=document.getElementById("msg");

function message(t,ok=false){msg.textContent=t;msg.className="msg "+(ok?"ok":"error")}

async function requireAdmin(){
  const {data,error}=await db.auth.getUser();
  if(error || !data.user) throw new Error("La sesión de administrador no está activa.");
  if(data.user.id!==ADMIN_UID) throw new Error("Esta cuenta no tiene permisos de administrador.");
}

async function loadProducts(){
  list.textContent="Cargando...";
  const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});
  if(error){list.textContent="No se pudieron cargar los productos: "+error.message;return}
  if(!data.length){list.textContent="No hay productos todavía.";return}
  list.innerHTML="";
  data.forEach(p=>{
    const card=document.createElement("div");card.className="card";
    const thumb=document.createElement("div");thumb.className="thumb";
    if(Array.isArray(p.images)&&p.images[0]){const im=document.createElement("img");im.src=p.images[0];thumb.appendChild(im)}else thumb.textContent="Sin foto";
    const info=document.createElement("div");
    info.innerHTML="<strong>"+esc(p.name)+"</strong><br>Q "+Number(p.price).toLocaleString("es-GT")+"<br><span class='small'>"+esc(p.description||"")+"</span><br><span class='small'>"+(p.sold_out?"AGOTADO":"DISPONIBLE")+"</span>";
    const actions=document.createElement("div");actions.className="actions";
    const stock=document.createElement("button");stock.className="stock";stock.textContent=p.sold_out?"Poner disponible":"Marcar agotado";
    stock.onclick=async()=>{try{await requireAdmin();const {error}=await db.from("products").update({sold_out:!p.sold_out}).eq("id",p.id);if(error)throw error;loadProducts()}catch(e){message(e.message)}};
    const del=document.createElement("button");del.className="danger";del.textContent="🗑 Eliminar";
    del.onclick=async()=>{if(!confirm("¿Eliminar "+p.name+"?"))return;try{await requireAdmin();const {error}=await db.from("products").delete().eq("id",p.id);if(error)throw error;loadProducts()}catch(e){message(e.message)}};
    actions.append(stock,del);info.appendChild(actions);card.append(thumb,info);list.appendChild(card);
  });
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}

document.getElementById("reload").onclick=loadProducts;

document.getElementById("productForm").onsubmit=async e=>{
 e.preventDefault();
 try{
  await requireAdmin();
  message("Subiendo producto...",true);
  const files=[...document.getElementById("images").files];
  if(!files.length)throw new Error("Selecciona al menos una foto.");
  const urls=[];
  for(const file of files){
   const path=Date.now()+"-"+crypto.randomUUID()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const {error}=await db.storage.from("product-images").upload(path,file,{upsert:false});
   if(error)throw error;
   const {data}=db.storage.from("product-images").getPublicUrl(path);
   urls.push(data.publicUrl);
  }
  const {error}=await db.from("products").insert({
    name:document.getElementById("name").value.trim(),
    price:Number(document.getElementById("price").value),
    description:document.getElementById("description").value.trim(),
    images:urls,
    sold_out:false
  });
  if(error)throw error;
  e.target.reset();message("Producto agregado correctamente ✅",true);loadProducts();
 }catch(err){message(err.message||String(err))}
};

loadProducts();
</script>
</body>
</html>
